<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Trace — Gambar ke SVG &amp; XML Alight Motion</title>
<style>
:root{--bg:#0d1109;--p:#1d2415;--p2:#26301c;--bd:#2a3321;--tx:#98ce7b;--mu:#a5b39a;--ac:#98ce7b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--mu);font:14px system-ui,sans-serif;padding:16px;max-width:960px;margin:auto}
h1{color:var(--tx);font-size:20px;margin:0 0 4px}small{opacity:.8}
.card{background:var(--p);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:28px;text-align:center;cursor:pointer}#drop.on{border-color:var(--ac)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px}
select,input{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
button{background:var(--ac);color:#0d1109;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
button.s{background:var(--p2);color:var(--tx)}button:disabled{opacity:.4;cursor:default}
#out{background:repeating-conic-gradient(#222 0 25%,#2b2b2b 0 50%) 0 0/16px 16px;border-radius:10px;min-height:120px;display:flex;justify-content:center}
#out svg{max-width:100%;max-height:60vh;height:auto}#st{margin-top:8px;font-size:12px}.err{color:#ff8a8a}
</style></head><body>
<h1>AUTO TRACE</h1><small>Gambar → SVG → XML Alight Motion · semua diproses di perangkat Anda</small>
<div class="card"><div id="drop">Tarik gambar PNG/JPG/WEBP ke sini atau ketuk untuk memilih</div><input id="f" type="file" accept="image/png,image/jpeg,image/webp" hidden></div>
<div class="card"><div class="row">
<label>Mode<select id="mode"><option value="color">Color</option><option value="bw">B&amp;W</option></select></label>
<label>Jumlah warna (Color)<input id="nc" type="number" min="2" max="32" value="8"></label>
<label>Buang detail kecil (px)<input id="po" type="number" min="0" max="100" value="8"></label>
<label>Ukuran scene (sisi terpanjang)<input id="sz" type="number" min="200" max="4000" value="1440"></label>
<label>Background<input id="bg" type="color" value="#ffffff"></label></div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button id="go" disabled>Trace</button><button class="s" id="dsvg" disabled>Unduh SVG</button><button class="s" id="dxml" disabled>Unduh XML Alight</button></div><div id="st"></div></div>
<div class="card"><div id="out"></div></div>
<script src="src/svg2am.js"></script>
<script>
const $=i=>document.getElementById(i),CDN='https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js';
const load=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
const lib=load('lib/imagetracer_v1.2.6.js').catch(()=>load(CDN));
let img,name='Auto Trace',svgStr='',xmlStr='';
const msg=(t,e)=>{$('st').className=e?'err':'';$('st').textContent=t};
function take(file){if(!file||!/^image\/(png|jpeg|webp)$/.test(file.type))return msg('Format harus PNG, JPG, atau WEBP.',1);
 name=file.name.replace(/\.[^.]+$/,'');const im=new Image();im.onload=()=>{img=im;$('go').disabled=false;msg(im.naturalWidth+'×'+im.naturalHeight+' px siap di-trace.')};im.onerror=()=>msg('Gambar gagal dibaca.',1);im.src=URL.createObjectURL(file)}
$('drop').onclick=()=>$('f').click();$('f').onchange=e=>take(e.target.files[0]);
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};$('drop').ondragleave=()=>$('drop').classList.remove('on');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('on');take(e.dataTransfer.files[0])};
$('go').onclick=async()=>{try{await lib}catch(e){return msg('ImageTracer gagal dimuat (cek internet atau taruh file di lib/).',1)}
 $('go').disabled=true;msg('Memproses…');await new Promise(r=>setTimeout(r,30));
 try{const bw=$('mode').value==='bw',k=Math.min(1,1024/Math.max(img.naturalWidth,img.naturalHeight));
  const cw=Math.round(img.naturalWidth*k),ch=Math.round(img.naturalHeight*k),c=document.createElement('canvas');c.width=cw;c.height=ch;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,cw,ch);
  const o={numberofcolors:bw?2:+$('nc').value,colorsampling:2,pathomit:+$('po').value,ltres:1,qtres:1,strokewidth:0,roundcoords:2,blurradius:0,colorquantcycles:3};
  if(bw)o.pal=[{r:0,g:0,b:0,a:255},{r:255,g:255,b:255,a:255}];
  svgStr=ImageTracer.imagedataToSVG(x.getImageData(0,0,cw,ch),o);
  const doc=new DOMParser().parseFromString(svgStr,'image/svg+xml'),shapes=[];
  doc.querySelectorAll('path').forEach(p=>{const op=parseFloat(p.getAttribute('opacity')||'1'),f=p.getAttribute('fill')||'';
   const m=f.match(/\d+/g)||[0,0,0];if(op===0||(bw&&(+m[0]+ +m[1]+ +m[2])/3>127))return;shapes.push({fill:f,opacity:op,d:p.getAttribute('d')})});
  const s=+$('sz').value/Math.max(cw,ch),W=Math.round(cw*s),H=Math.round(ch*s),h=$('bg').value;
  xmlStr=Svg2Am.buildScene({title:name,width:W,height:H,scale:s,bg:'#ff'+h.slice(1),shapes:shapes.map((q,i)=>({...q,label:'Trace '+(i+1)}))});
  $('out').innerHTML=svgStr;$('dsvg').disabled=$('dxml').disabled=false;msg(shapes.length+' shape · scene '+W+'×'+H+' · urutan layer: bawah → atas.')}
 catch(e){msg('Gagal: '+e.message,1)}$('go').disabled=false};
const dl=(t,n,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
$('dsvg').onclick=()=>dl(svgStr,name+'.svg','image/svg+xml');$('dxml').onclick=()=>dl(xmlStr,name+'.xml','application/xml');
</script></body></html>
